<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripplix Animation Library</title>
    <style>
        .preview-modal-video::-webkit-media-controls,
        .preview-modal-video::-webkit-media-controls-enclosure,
        .preview-modal-video::-webkit-media-controls-panel,
        .preview-modal-video::-webkit-media-controls-overlay-play-button,
        .preview-modal-video::-webkit-media-controls-start-playback-button {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <div id="preview-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; overflow: hidden;">
        <div id="preview-card-container" style="background-color: white; border-radius: 16px; width: 480px; max-width: 98vw; max-height: 98vh; overflow-y: auto; overflow-x: hidden; position: relative; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.18); padding: 0; margin: 0 auto;">
            <button id="preview-close" style="position: absolute; top: 16px; right: 16px; background: transparent; border: none; font-size: 22px; cursor: pointer; z-index: 2;">✕</button>
            <div id="preview-card-content" style="padding: 0; width: 100%;"></div>
        </div>
    </div>
    <script>
        // Function to open preview modal
        function openPreview(animation) {
            const modal = document.getElementById('preview-modal');
            const content = document.getElementById('preview-card-content');

            if (!modal || !content) return;

            content.innerHTML = '';

            const previewContent = document.createElement('div');
            previewContent.style.width = '100%';

            const video = document.createElement('video');
            video.src = animation.video_url || animation.animation_url || '';
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            video.controls = false;
            video.setAttribute('controlsList', 'nodownload nofullscreen noremoteplayback');
            video.setAttribute('disablePictureInPicture', 'true');
            video.style.width = '100%';
            video.style.display = 'block';
            video.style.pointerEvents = 'none'; // Prevents user interaction

            previewContent.appendChild(video);

            const details = document.createElement('div');
            details.style.padding = '16px';

            const productInfo = document.createElement('div');
            productInfo.style.display = 'flex';
            productInfo.style.alignItems = 'center';
            productInfo.style.marginBottom = '12px';

            if (animation.product_logo || animation.logo) {
                const logo = document.createElement('img');
                logo.src = animation.product_logo || animation.logo;
                logo.alt = animation.product || 'Product';
                logo.style.width = '24px';
                logo.style.height = '24px';
                logo.style.marginRight = '8px';
                logo.style.borderRadius = '4px';
                productInfo.appendChild(logo);
            }

            const productName = document.createElement('div');
            productName.textContent = animation.product || 'Product';
            productName.style.fontWeight = '600';
            productInfo.appendChild(productName);

            details.appendChild(productInfo);

            const title = document.createElement('h3');
            title.textContent = animation.title || 'Animation';
            title.style.margin = '0 0 12px 0';
            title.style.fontSize = '18px';
            details.appendChild(title);

            if (animation.interaction && animation.interaction.length > 0) {
                const interactionContainer = document.createElement('div');
                interactionContainer.style.display = 'flex';
                interactionContainer.style.flexWrap = 'wrap';
                interactionContainer.style.gap = '8px';
                interactionContainer.style.marginBottom = '16px';

                animation.interaction.forEach(interaction => {
                    const tag = document.createElement('span');
                    tag.className = 'interaction-tag';
                    tag.textContent = interaction;
                    interactionContainer.appendChild(tag);
                });

                details.appendChild(interactionContainer);
            }

            const addButton = document.createElement('button');
            addButton.className = 'add-button';
            addButton.textContent = 'Add to Figma';
            addButton.style.width = '100%';
            addButton.addEventListener('click', () => {
                parent.postMessage({
                    pluginMessage: {
                        type: 'add-animation',
                        animation: animation
                    }
                }, '*');
                modal.style.display = 'none';
            });

            details.appendChild(addButton);
            previewContent.appendChild(details);

            content.appendChild(previewContent);

            modal.style.display = 'flex';

            const closeButton = document.getElementById('preview-close');
            if (closeButton) {
                closeButton.onclick = () => {
                    modal.style.display = 'none';
                };
            }

            modal.onclick = (event) => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            };

            video.play().catch(err => console.error('Error playing video:', err));
        }
    </script>
</body>

</html>
